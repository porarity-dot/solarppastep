<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">ภาพวาดมุมมองด้านบน แนวคิดติดตั้งแผงโซลาร์เซลล์บนหลังคา</title>
<desc id="desc">ผังหลังคาโรงงานโดยวางแผงโซลาร์เซลล์เป็นกลุ่ม เว้นแนวทางเดินและช่องบริการ แสดงเพื่อประกอบการพิจารณาเท่านั้น</desc>
<defs>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#f4f7f8"/><stop offset="1" stop-color="#dce5e8"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#176d87"/><stop offset="1" stop-color="#0d344b"/></linearGradient>
 <pattern id="modules" width="38" height="24" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="34" height="20" rx="1.7" fill="url(#panel)" stroke="#a8d7df" stroke-width="1.2"/><path d="M13 2v20M25 2v20M2 12h34" stroke="#6fb2c2" stroke-width=".65" opacity=".85"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#183943" flood-opacity=".18"/></filter>
</defs>
<rect width="1000" height="600" fill="#eef4f4"/>
<text x="54" y="54" font-family="Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#123c45">แนวคิดการจัดวางแผง Solar Cell บนหลังคา</text>
<text x="55" y="82" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#53717a">TOP VIEW · ระบบเสนอขนาด 300 kWp · เว้นพื้นที่ทางเดินและบำรุงรักษา</text>
<g filter="url(#shadow)">
 <rect x="55" y="112" width="890" height="405" rx="14" fill="#c7d2d5"/>
 <rect x="68" y="125" width="864" height="379" rx="8" fill="url(#roof)" stroke="#869ba1" stroke-width="2"/>
</g>
<!-- roof seams -->
<g stroke="#aebdc1" stroke-width="1" opacity=".8"><path d="M68 220h864M68 315h864M68 410h864"/><path d="M284 125v379M500 125v379M716 125v379"/></g>
<!-- clear maintenance corridors -->
<rect x="82" y="283" width="836" height="25" rx="4" fill="#fff" stroke="#d79e37" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="488" y="143" width="24" height="343" rx="4" fill="#fff" stroke="#d79e37" stroke-width="2" stroke-dasharray="8 6"/>
<!-- panel fields -->
<rect x="91" y="148" width="365" height="123" rx="3" fill="url(#modules)"/>
<rect x="544" y="148" width="365" height="123" rx="3" fill="url(#modules)"/>
<rect x="91" y="320" width="365" height="163" rx="3" fill="url(#modules)"/>
<rect x="544" y="320" width="365" height="163" rx="3" fill="url(#modules)"/>
<!-- roof access / service zones -->
<rect x="432" y="335" width="43" height="70" rx="5" fill="#e9eff0" stroke="#879da2" stroke-width="2"/>
<text x="453" y="365" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="10" fill="#526b71" transform="rotate(-90 453 365)">ช่องงานระบบ</text>
<rect x="525" y="177" width="13" height="45" rx="3" fill="#f4d38b" stroke="#bf8c2c"/>
<path d="M884 452l20-18v36z" fill="#f4d38b" stroke="#bf8c2c"/>
<text x="500" y="301" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="12" font-weight="700" fill="#93681d">แนวทางเดินตรวจสอบและบำรุงรักษา</text>
<g transform="translate(870 535)" font-family="Tahoma,Arial,sans-serif" fill="#294b53"><text x="0" y="0" text-anchor="middle" font-size="13" font-weight="700">N</text><path d="M0 7l-8 22 8-5 8 5z" fill="#168195"/></g>
<text x="55" y="565" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#526b71">แบบแสดงแนวคิดเท่านั้น · ต้องสำรวจขนาดหลังคา โครงสร้าง เงาบัง และระยะหนีไฟก่อนออกแบบก่อสร้าง</text>
<g transform="translate(820 552)"><rect width="14" height="10" rx="1" fill="#10445b"/><text x="21" y="10" font-family="Tahoma,Arial,sans-serif" font-size="12" fill="#526b71">แผง Solar Cell</text></g>
</svg>



